<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store self-check</title>
</head>
<body>
<p>Open the console to see results.</p>
<script src="../js/dom.js"></script>
<script src="../js/validate.js"></script>
<script src="../js/store.js"></script>
<script src="../js/views/catalog.js"></script>
<script>
    const memory = () => {
        const m = new Map();
        return { getItem: (k) => m.get(k) ?? null, setItem: (k, v) => m.set(k, String(v)) };
    };
    const storage = memory();
    const store = App.createStore(storage, 'k');

    let passed = 0, failed = 0;
    function check(label, condition) {
        console.assert(condition, label);
        condition ? passed++ : failed++;
    }

    // seeding
    const categories = store.getCategories();
    check('seeds 3 categories', categories.length === 3);
    check('seeds 4 products total', categories.reduce((n, c) => n + c.products.length, 0) === 4);

    // category CRUD
    const cat = store.addCategory('Books');
    check('addCategory persists', store.getCategory(cat.id)?.name === 'Books');
    check('data survives a new store instance', App.createStore(storage, 'k').getCategory(cat.id)?.name === 'Books');
    store.updateCategory(cat.id, 'Books & Media');
    check('updateCategory renames', store.getCategory(cat.id).name === 'Books & Media');

    // product CRUD
    const product = store.addProduct(cat.id, { name: 'Novel', price: 15, image: '', description: '' });
    check('addProduct persists', store.getProduct(product.id)?.name === 'Novel');
    store.updateProduct(product.id, { price: 20 });
    check('updateProduct updates field', store.getProduct(product.id).price === 20);
    store.deleteProduct(product.id);
    check('deleteProduct removes it', store.getProduct(product.id) === null);

    // moving a product between categories
    const [from, to] = store.getCategories();
    const mover = store.addProduct(from.id, { name: 'Mover', price: 1, image: '', description: '' });
    store.updateProduct(mover.id, { categoryId: to.id });
    check('updateProduct moves product to another category',
        store.getProduct(mover.id).categoryId === to.id && !store.getCategory(from.id).products.some((p) => p.id === mover.id));

    // image normalization
    const insecure = store.addProduct(from.id, { name: 'Img', price: 1, image: 'http://x.com/a.png', description: '' });
    check('non-https image is dropped', insecure.image === '');
    const secure = store.addProduct(from.id, { name: 'Img', price: 1, image: 'https://x.com/a.png', description: '' });
    check('https image is kept', secure.image === 'https://x.com/a.png');

    // cascade delete
    const cat2 = store.addCategory('Toys');
    const product2 = store.addProduct(cat2.id, { name: 'Ball', price: 5, image: '', description: '' });
    store.deleteCategory(cat2.id);
    check('deleteCategory cascades to its products', store.getProduct(product2.id) === null);

    // corrupted storage reseeds instead of crashing
    for (const bad of ['{oops', 'null', '']) {
        const s = memory();
        s.setItem('k', bad);
        check(`reseeds on corrupted storage (${JSON.stringify(bad)})`, App.createStore(s, 'k').getCategories().length === 3);
    }

    // a failed write must not leave a phantom record in memory
    let fail = false;
    const base = memory();
    const flaky = { getItem: base.getItem, setItem: (k, v) => { if (fail) throw new Error('quota'); base.setItem(k, v); } };
    const s3 = App.createStore(flaky, 'k');
    s3.getCategories();
    fail = true;
    try { s3.addCategory('Ghost'); } catch {}
    fail = false;
    check('failed write leaves no phantom category', !s3.getCategories().some((c) => c.name === 'Ghost'));

    // HTML escaping (product/category names get injected into innerHTML by the views)
    check('escapeHtml neutralizes tags and quotes', App.escapeHtml('<img src=x>"\'') === '&lt;img src=x&gt;&quot;&#39;');

    // html`` template: escapes interpolations, nests, and lets App.raw through
    const evil = '<img src=x onerror=alert(1)>';
    check('html`` escapes interpolations', String(App.html`<p>${evil}</p>`) === '<p>&lt;img src=x onerror=alert(1)&gt;</p>');
    check('html`` nests templates and arrays', String(App.html`<ul>${[1, 2].map((n) => App.html`<li>${n}</li>`)}</ul>`) === '<ul><li>1</li><li>2</li></ul>');
    check('html`` renders null as empty and keeps 0', String(App.html`${null}|${0}`) === '|0');
    check('App.raw is not escaped', String(App.html`${App.raw('<b>x</b>')}`) === '<b>x</b>');

    // catalog filtering (pure)
    const cats = App.createStore(memory(), 'f').getCategories(); // fresh seed: 1 + 2 + 1 products
    const q = (s) => new URLSearchParams(s);
    const f = (s) => App.filterProducts(cats, q(s));
    check('no filters returns every product', f('').products.length === 4);
    check('category filter', f('category=home').products.every((p) => p.categoryId === 'home') && f('category=home').products.length === 2);
    check('multiple categories are OR-ed', f('category=home&category=tech').products.length === 3);
    check('min/max price', f('minPrice=10&maxPrice=30').products.every((p) => p.price >= 10 && p.price <= 30));
    check('garbage price is ignored', f('minPrice=abc&maxPrice=-5').products.length === f('').products.length);
    check('minPrice=0 is a real filter value', f('minPrice=0').min === 0);

    console.log(`${passed} passed, ${failed} failed`);
</script>
</body>
</html>
